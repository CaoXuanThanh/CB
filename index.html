<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hoàn Tiền Mua Sắm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
    @keyframes pulse-border { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    .animate-cta { animation: pulse-border 1.5s infinite; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen bg-gray-50 pb-24 shadow-lg">

  <!-- Header & Quản lý ví -->
  <div class="bg-gradient-to-r from-orange-500 to-red-600 text-white p-5 rounded-b-3xl shadow-md">
    <div class="flex justify-between items-center mb-1">
      <h1 class="text-xl font-extrabold tracking-tight">🎁 Mua sắm hoàn tiền</h1>
      <span class="text-xs bg-white/20 px-3 py-1 rounded-full font-semibold">Shopee</span>
    </div>
    
    <div class="mt-4 bg-white/15 backdrop-blur-sm p-3 rounded-2xl border border-white/25 cursor-pointer" onclick="toggleVi()">
      <div class="flex justify-between items-center">
        <span class="text-sm font-bold">💰 Ví của tôi (Bấm để xem/rút tiền)</span>
        <span class="text-xs bg-white/30 px-2 py-1 rounded">▼</span>
      </div>
      <!-- Form Ví ẩn/hiện -->
      <div id="formQuanLyVi" class="hidden mt-3 pt-3 border-t border-white/20 space-y-2">
        <input id="phoneInput" type="tel" placeholder="Số điện thoại của bạn" class="w-full px-3 py-2 rounded-xl text-gray-900 text-sm focus:outline-none" />
        <div class="flex gap-2">
          <input id="pinInput" type="password" placeholder="Mã PIN 4 số" class="w-full px-3 py-2 rounded-xl text-gray-900 text-sm focus:outline-none text-center tracking-widest" />
          <button onclick="taiDuLieuVi(false)" class="bg-yellow-400 text-gray-900 font-bold px-4 rounded-xl text-sm whitespace-nowrap">Xem Ví</button>
        </div>
      </div>
    </div>

    <!-- Thẻ Số Dư -->
    <div id="soDuArea" class="hidden mt-3.5 grid grid-cols-2 gap-3 text-center">
      <div class="bg-white text-gray-800 p-3 rounded-2xl shadow-sm">
        <span class="text-xs text-gray-500 font-medium block">Số dư rút được</span>
        <span id="soDuKhaDung" class="text-lg font-extrabold text-green-600">0 đ</span>
      </div>
      <div class="bg-white text-gray-800 p-3 rounded-2xl shadow-sm">
        <span class="text-xs text-gray-500 font-medium block">Đơn chờ đối soát</span>
        <span id="soDonCho" class="text-lg font-extrabold text-orange-500">0 đơn</span>
      </div>
    </div>
  </div>

  <div id="alertBox" class="hidden mx-4 mt-4 p-3.5 rounded-2xl text-xs font-semibold border"></div>

  <!-- BƯỚC MUA HÀNG CHÍNH (Rất đơn giản) -->
  <div class="p-4">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-gray-800">🛒 Dán link mua hàng vào đây</h2>
      </div>

      <textarea id="linkInput" rows="2" placeholder="Dán link sản phẩm Shopee..." 
        class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none mb-3"></textarea>

      <!-- Khung nhập SĐT (Chỉ hiện khi chưa có SĐT) -->
      <div id="boxNhapSDT" class="mb-3">
        <label class="text-xs text-gray-500 mb-1 block">Nhập Số điện thoại để nhận hoàn tiền đơn này:</label>
        <input id="fastPhoneInput" type="tel" placeholder="Số điện thoại của bạn" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none" />
      </div>

      <button id="btnMua" onclick="xuLyMuaHang()" class="w-full bg-gradient-to-r from-orange-500 to-red-600 text-white font-extrabold py-3.5 rounded-xl shadow-md transition text-sm">
        🚀 NHẬN HOÀN TIỀN NGAY
      </button>

      <!-- Hộp Kết Quả -->
      <div id="boxKetQuaLink" class="hidden mt-4 p-4 bg-green-50 border-2 border-green-500 rounded-2xl text-center">
        <p class="text-xs text-green-900 font-bold mb-1">✅ KÍCH HOẠT HOÀN TIỀN THÀNH CÔNG!</p>
        <p id="tenSPKetQua" class="text-[11px] text-gray-600 line-clamp-1 mb-3"></p>
        <a id="linkChuyenHuong" href="#" target="_top" class="animate-cta block w-full bg-green-600 text-white font-extrabold text-sm py-3.5 rounded-xl shadow-lg mb-2">
          👉 MỞ SHOPEE MUA HÀNG
        </a>
      </div>
    </div>
  </div>

  <!-- Các chức năng khác -->
  <div class="px-4 mb-3">
    <div class="grid grid-cols-2 bg-gray-200 p-1 rounded-xl text-xs font-bold text-gray-600">
      <button onclick="chuyenTab('tabDonHang')" id="btnTabDon" class="py-2.5 rounded-lg bg-white text-gray-900 shadow-sm">Lịch sử đơn</button>
      <button onclick="chuyenTab('tabRutTien')" id="btnTabRut" class="py-2.5 rounded-lg">Rút tiền</button>
    </div>
  </div>

  <div id="tabDonHang" class="px-4">
    <div id="danhSachDon" class="space-y-2.5">
      <p class="text-center text-xs text-gray-400 py-6">Đăng nhập "Ví của tôi" để xem lịch sử.</p>
    </div>
  </div>

  <div id="tabRutTien" class="px-4 hidden">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4 space-y-2.5">
      <input id="bankName" type="text" placeholder="Tên Ngân hàng" class="w-full p-3 bg-gray-50 border rounded-xl text-sm" />
      <input id="bankAcc" type="text" placeholder="Số tài khoản" class="w-full p-3 bg-gray-50 border rounded-xl text-sm" />
      <input id="bankOwner" type="text" placeholder="Tên chủ tài khoản" class="w-full p-3 bg-gray-50 border rounded-xl text-sm" />
      <input id="withdrawAmount" type="number" placeholder="Số tiền muốn rút" class="w-full p-3 bg-gray-50 border rounded-xl text-sm" />
      <button onclick="guiYeuCauRut()" class="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl shadow">Rút Tiền</button>
    </div>
    <div id="danhSachRut" class="space-y-2"></div>
  </div>

  <!-- Nút Lấy link giới thiệu -->
  <div class="px-4 mt-6 text-center">
    <button onclick="layLinkGioiThieu()" class="text-xs text-blue-600 font-bold bg-blue-50 px-4 py-2 rounded-full border border-blue-200">🔗 Lấy link giới thiệu kiếm thêm 30%</button>
  </div>

  <script>
    // URL Web App của bạn
    const API_URL = "https://script.google.com/macros/s/AKfycbyYEQksLDQKHXJBFiVIsvwvn1Df12vstiQrDJuElEXwgHhaA-VBa9iIWvmx_f6PXjlJ/exec";
    
    // GHI NHẬN MÃ GIỚI THIỆU TỪ URL NGAY KHI VÀO TRANG
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const ref = urlParams.get('ref');
      if (ref) localStorage.setItem('ref_by', ref); // Lưu sđt của bạn A ngầm vào máy khách

      // Tự động điền SĐT nếu khách đã từng mua
      const savedPhone = localStorage.getItem('cashback_phone');
      if (savedPhone) {
        document.getElementById('fastPhoneInput').value = savedPhone;
        document.getElementById('boxNhapSDT').classList.add('hidden'); // Giấu ô nhập đi cho mượt
        document.getElementById('phoneInput').value = savedPhone;
      }
    };

    function hienThongBao(msg, isError = true) {
      const box = document.getElementById('alertBox');
      box.className = `mx-4 mt-4 p-3.5 rounded-2xl text-xs font-semibold border ${isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'}`;
      box.innerText = (isError ? '⚠️ ' : '✅ ') + msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 5000);
    }

    async function goiAPI(payload) {
      const params = new URLSearchParams(payload).toString();
      const resp = await fetch(API_URL + "?" + params, { method: "GET", redirect: "follow" });
      const json = await resp.json();
      if (!json.ok) throw new Error(json.error);
      return json.data;
    }

    function formatVND(num) { return Number(num || 0).toLocaleString('vi-VN') + ' đ'; }

    function toggleVi() { document.getElementById('formQuanLyVi').classList.toggle('hidden'); }
    function chuyenTab(tabId) {
      ['tabDonHang', 'tabRutTien'].forEach(id => document.getElementById(id).classList.add('hidden'));
      ['btnTabDon', 'btnTabRut'].forEach(id => document.getElementById(id).className = 'py-2.5 rounded-lg text-gray-600');
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById(tabId === 'tabDonHang' ? 'btnTabDon' : 'btnTabRut').className = 'py-2.5 rounded-lg bg-white text-gray-900 shadow-sm';
    }

    // LUỒNG TẠO LINK MUA HÀNG (Không cần PIN)
    async function xuLyMuaHang() {
      let phone = document.getElementById('fastPhoneInput').value.trim() || document.getElementById('phoneInput').value.trim();
      const rawLink = document.getElementById('linkInput').value.trim();
      const refBy = localStorage.getItem('ref_by') || ""; // Lấy mã của bạn A ra

      if (!phone) return hienThongBao('Vui lòng nhập Số điện thoại để hệ thống biết trả tiền hoàn cho ai!', true);
      if (!rawLink.includes('shopee')) return hienThongBao('Vui lòng dán link sản phẩm Shopee hợp lệ!', true);

      // Lưu đè lại sđt để lần sau khách vào không phải nhập nữa
      localStorage.setItem('cashback_phone', phone);
      document.getElementById('boxNhapSDT').classList.add('hidden');

      const btn = document.getElementById('btnMua');
      btn.disabled = true; btn.innerText = '⏳ Đang xử lý...';

      try {
        const res = await goiAPI({ action: 'taoLink', phone: phone, rawText: rawLink, ref: refBy });
        btn.disabled = false; btn.innerText = '🚀 NHẬN HOÀN TIỀN NGAY';
        document.getElementById('linkInput').value = '';
        
        document.getElementById('tenSPKetQua').innerText = res.tenSP;
        document.getElementById('linkChuyenHuong').href = res.redirectUrl;
        document.getElementById('boxKetQuaLink').classList.remove('hidden');
      } catch (err) {
        btn.disabled = false; btn.innerText = '🚀 NHẬN HOÀN TIỀN NGAY';
        hienThongBao(err.message, true);
      }
    }

    async function taiDuLieuVi(chayNgam) {
      const phone = document.getElementById('phoneInput').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      if (!phone || !pin) return hienThongBao('Nhập đủ SĐT và Mã PIN 4 số!', true);

      try {
        const res = await goiAPI({ action: 'layVi', phone: phone, pin: pin });
        document.getElementById('soDuArea').classList.remove('hidden');
        document.getElementById('soDuKhaDung').innerText = formatVND(res.soDuKhaDung);
        document.getElementById('soDonCho').innerText = res.soDonCho + ' đơn';

        const donContainer = document.getElementById('danhSachDon');
        donContainer.innerHTML = (res.lichSuDon.length === 0) ? '<p class="text-center text-xs text-gray-400 py-6">Chưa có đơn hàng nào.</p>' 
          : res.lichSuDon.map(d => `<div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center mb-2">
            <div><span class="text-[10px] bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded">${d.san}</span><p class="text-xs font-bold mt-1 line-clamp-1">${d.tenSP}</p></div>
            <div class="text-right whitespace-nowrap"><span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded-full">${d.trangThai}</span><p class="text-sm font-bold text-green-600 mt-1">+${formatVND(d.tienHoan)}</p></div></div>`).join('');
        
        if (res.isNewUser) hienThongBao('🎉 Đã tạo Ví mới bằng Mã PIN của bạn!', false);
      } catch (err) { hienThongBao(err.message, true); }
    }

    function layLinkGioiThieu() {
      const phone = localStorage.getItem('cashback_phone') || document.getElementById('phoneInput').value.trim();
      if (!phone) return hienThongBao('Bạn cần dán link mua hàng hoặc điền SĐT 1 lần để hệ thống biết bạn là ai trước khi tạo link chia sẻ!', true);
      
      const currentDomain = window.location.origin;
      const refLink = currentDomain + '/?ref=' + phone;
      navigator.clipboard.writeText(refLink);
      hienThongBao('🎉 Đã copy link giới thiệu! Gửi link này cho bạn bè, khi họ mua hàng bạn sẽ nhận được 30% hoa hồng!', false);
    }
  </script>
</body>
</html>
